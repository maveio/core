name: Self-hosted upload
on:
  pull_request:
    paths:
      - compose.yaml
      - deploy/self-hosted/**
      - .github/workflows/self-hosted-upload.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check quickstart upload startup and resumable uploads
        run: python3 deploy/self-hosted/upload_smoke.py
