# Only used by smoke.sh, with a fresh project, private .env and owned network.
services:
  minio:
    build:
      context: ./minio
    ports: !reset []
  storage-init:
    build:
      context: ./minio
  clickhouse:
    volumes:
      - ./trust:/etc/mave-ca:ro
      - ./trust/clickhouse.xml:/etc/clickhouse-server/config.d/public-trust.xml:ro
  caddy:
    ports: !reset []
    volumes:
      - ./trust:/etc/mave-ca:ro

networks:
  default:
    external: true
    name: ${MAVE_SMOKE_RUN_ID:?Run this through smoke.sh}
    ipam: !reset {}
